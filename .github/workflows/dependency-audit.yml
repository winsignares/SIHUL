name: Dependency Audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # Semanal, lunes 03:00 UTC

jobs:
  python-audit:
    name: Python Audit (backend + chatbot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit backend
        run: pip-audit -r backend/requirements.txt

      - name: pip-audit chatbot
        run: pip-audit -r chatbot/requirements.txt

  node-audit:
    name: Node Audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean)
        run: npm ci

      - name: npm audit (fail on High/Critical, excluding accepted risks)
        run: |
          npm audit --omit=dev --json > audit.json 2>&1 || true
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulns = Object.entries(data.vulnerabilities || {});
          const failSeverities = new Set(['high', 'critical']);
          const acceptedRisks = new Set(['xlsx', 'dompurify']);
          const blockingVulns = vulns.filter(([key, vuln]) => {
            const isAccepted = Array.from(acceptedRisks).some((pkg) => key.includes(pkg));
            return !isAccepted && failSeverities.has(vuln.severity);
          });
          
          if (blockingVulns.length > 0) {
            console.error('❌ Found High/Critical vulnerabilities:');
            blockingVulns.forEach(([key, vuln]) => {
              console.error(\`  - \${key}: \${vuln.severity}\`);
            });
            process.exit(1);
          }
          
          const acceptedFound = vulns.filter(([key]) =>
            Array.from(acceptedRisks).some((pkg) => key.includes(pkg))
          );
          if (acceptedFound.length > 0) {
            console.log('⚠️  Accepted dependency audit risks:');
            acceptedFound.forEach(([key, vuln]) => {
              console.log(\`  - \${key}: \${vuln.severity}\`);
            });
          }
          
          console.log('✅ No blocking High/Critical vulnerabilities found');
          process.exit(0);
          "
