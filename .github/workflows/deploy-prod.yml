name: Deploy Production

# Despliega a producción la punta de main, DESPUÉS de que "Build Images" haya publicado las imágenes y
# alguien con permiso apruebe el entorno "production" (revisores obligatorios en Settings > Environments).
# El job corre en el runner del servidor (usuario sin privilegios) y solo ejecuta un script de root con validaciones.
# No hace checkout: no ejecuta código del repositorio en el servidor.
on:
  # TEMPORAL: sin disparo automatico hasta que existan el entorno "production" con revisores y el
  # runner del servidor. Mientras tanto solo se ejecuta a mano (Actions > Deploy Production > Run workflow).
  # Para activarlo, restaurar:
  #   workflow_run:
  #     workflows: ["Build Images"]
  #     types: [completed]
  #     branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Solo un push a main de este mismo repositorio (nunca un fork ni un PR).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, sihul-prod]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Desplegar en el servidor
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: sudo /usr/local/sbin/sihul-deploy-ci "$SHA"
