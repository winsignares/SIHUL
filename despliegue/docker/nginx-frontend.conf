# nginx DENTRO del contenedor del frontend: solo estáticos y SPA.
# El TLS, /api, /media, /panel-sihul-gestion/, /accounts/ y /chatbot/ los resuelve
# el nginx del servidor (ver despliegue/nginx/).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html nunca en caché: evita apuntar a chunks antiguos tras un despliegue.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Assets del build (nombre con hash): caché larga. Si falta, 404 (nunca index.html).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Estáticos de Django (collectstatic) montados desde el volumen compartido con el backend.
    location ^~ /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public" always;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # SPA: cualquier ruta de frontend cae a index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
