# Cabeceras de seguridad básicas. Se incluye en CADA location porque en nginx un add_header
# dentro de un location anula los add_header heredados del nivel server.
# No incluye Content-Security-Policy a propósito: el nginx actual del servidor no la aplica y
# agregarla podría bloquear reCAPTCHA u otros scripts. Se evaluará como mejora aparte.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
