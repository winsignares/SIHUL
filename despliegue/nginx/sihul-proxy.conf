# Cabeceras comunes de proxy hacia los contenedores (snippet del nginx del servidor).
# Equivale a las líneas proxy_set_header que ya repite la configuración actual de /etc/nginx/sites-available/sihul.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
