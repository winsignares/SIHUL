# ============================================================================
# nginx del SERVIDOR — entorno de PRUEBAS en http://10.4.100.146:5273 (mismo URL de hoy).
#
# Hoy el puerto 5273 lo publica directamente el contenedor del frontend de pruebas viejo
# (Vite en modo desarrollo). Con el despliegue nuevo lo atiende nginx y los contenedores de
# pruebas quedan en 127.0.0.1 (frontend 8180, backend 8100, chatbot 8101).
# Solo se activa cuando el stack de pruebas viejo ya está apagado (el puerto debe estar libre).
# Pruebas usa http (sin certificado): por eso X-Forwarded-Proto va con $scheme.
# ============================================================================

server {
    listen 5273;
    listen [::]:5273;
    server_name _;
    client_max_body_size 30M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /panel-sihul-gestion/ { proxy_pass http://127.0.0.1:8100; }

    location ~ ^/api/usuarios/(login|logout|session-auth-state|change-password)/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8100;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8100;
    }

    location /accounts/ { proxy_pass http://127.0.0.1:8100; }

    location /media/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /chatbot { return 301 /chatbot/docs; }

    location = /chatbot/openapi.json {
        proxy_set_header X-Forwarded-Prefix /chatbot;
        proxy_pass http://127.0.0.1:8101/openapi.json;
    }

    location /chatbot/ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8101/;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / { proxy_pass http://127.0.0.1:8180; }
}
