# ============================================================================
# nginx del SERVIDOR — sitio sihul.unilibre.edu.co para el despliegue con contenedores.
#
# Se basa en la configuración REAL que hoy corre en /etc/nginx/sites-available/sihul.
# Qué NO cambia respecto a ella:
#   - Los puertos 80/443, el server_name, el certificado y su ruta, client_max_body_size.
#   - El bloque de validación del certificado (/.well-known/acme-challenge/) y su carpeta.
#   - Las rutas del backend: /panel-sihul-gestion/, /api/usuarios/(login|logout|...),
#     /api/, /accounts/, /media/ -> 127.0.0.1:8000, y /chatbot -> 127.0.0.1:8001.
# Qué SÍ cambia:
#   - El frontend, los assets y los estáticos de Django ya no se leen del directorio
#     /var/www/sihul: los sirve el contenedor "frontend" en 127.0.0.1:8080
#     (la última regla "location /"). Ya no hay que copiar el build a mano.
#
# Antes de aplicarla, compárala con la viva:
#   diff /etc/nginx/sites-available/sihul despliegue/nginx/sihul.conf
# Instalación (ver despliegue/README.md): copiar, nginx -t y recargar (reload, nunca restart).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    root /var/www/sihul;
    server_name sihul.unilibre.edu.co;

    # Necesario para que Certbot pueda validar la renovación del certificado.
    # Debe ir antes del redirect. El directorio /var/www/sihul DEBE seguir existiendo.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sihul;
        try_files $uri =404;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sihul.unilibre.edu.co;
    client_max_body_size 30M;

    ssl_certificate /etc/letsencrypt/live/sihul.unilibre.edu.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sihul.unilibre.edu.co/privkey.pem;

    root /var/www/sihul;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sihul;
        try_files $uri =404;
        default_type "text/plain";
    }

    # --- Backend Django -----------------------------------------------------
    # Panel administrativo de Django.
    location /panel-sihul-gestion/ {
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    # Endpoints legacy de usuarios: el frontend llama /api/usuarios/login/ pero Django los tiene en /usuarios/login/
    location ~ ^/api/usuarios/(login|logout|session-auth-state|change-password)/ {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    # API moderna: mantiene el prefijo /api
    location /api/ {
        proxy_request_buffering off;
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8000;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://sihul.unilibre.edu.co" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
    }

    # OAuth Microsoft via django-allauth.
    # Azure debe usar: https://sihul.unilibre.edu.co/accounts/microsoft/login/callback/
    location /accounts/ {
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    # Archivos subidos por usuarios (documentos de facturas)
    location /media/ {
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- Chatbot FastAPI ------------------------------------------------------
    # OJO: hoy el chatbot no autentica y queda expuesto aquí. Es la siguiente prioridad de seguridad.
    location = /chatbot {
        return 301 /chatbot/docs;
    }

    # OpenAPI del chatbot para Swagger UI.
    location = /chatbot/openapi.json {
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_set_header X-Forwarded-Prefix /chatbot;
        proxy_pass http://127.0.0.1:8001/openapi.json;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Chatbot FastAPI: publica https://sihul.unilibre.edu.co/chatbot/docs/
    location /chatbot/ {
        proxy_request_buffering off;
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8001/;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- Frontend (contenedor): SPA, assets y /static/ de Django -------------
    # El contenedor aplica la caché y las cabeceras de cada tipo de archivo.
    location / {
        include /etc/nginx/snippets/sihul-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
}
