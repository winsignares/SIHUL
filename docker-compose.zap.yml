# ZAP Baseline local scan (safe, passive)
# Usage:
#   1) Ensure stack is up: docker compose up -d db redis backend
#   2) Run scan: docker compose -f docker-compose.yml -f docker-compose.zap.yml run --rm zap
#   3) Open report: ./zap-reports/zap-baseline.html

services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-baseline
    # Passive baseline scan against the Django backend
    command: >
      zap-baseline.py
      -t http://backend:8000
      -r zap-baseline.html
      -a
    depends_on:
      backend:
        condition: service_started
    networks:
      - sihul_network
    volumes:
      - ./zap-reports:/zap/wrk:rw
